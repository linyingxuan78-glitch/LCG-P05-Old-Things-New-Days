# INTERNAL QA ONLY: no itch.io uploads, releases, Pages, or public store publishing.
# Independent Windows verification because Linux dummy/Vulkan importer is not a valid Windows GPU proxy.
name: LCG P05 Windows 4.4.1 verification and gated internal EXE

on:
  push:
    paths:
      - ".github/workflows/godot_windows_native_internal_v0170.yml"
      - "scripts/**"
      - "tests/**"
      - "project.godot"
      - "documentation/windows_visual_previews/.gitignore"
      - "main.tscn"
      - ".gitattributes"
      - "assets/ui_story_icons/**"
      - "licenses/USED_ASSET_PROVENANCE.csv"
      - "licenses/PLAYER_THIRD_PARTY_NOTICES.txt"
      - "tools/static_preflight.py"
      - "tools/sync_release_notices.py"
      - "tools/check_creator_provenance_v0166.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows_native_validation:
    runs-on: windows-2022
    timeout-minutes: 50
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out complete game source
        uses: actions/checkout@v4
      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact Godot 4.4.1 and Windows export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.4.1"
          use-dotnet: false
          include-templates: true
      - name: Inspect Godot binary and run source / provenance gates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The GitHub action's 'godot' alias targets the GUI binary, whose Windows
          # CLI exit behavior cannot be used to certify Godot --version or script exit codes.
          $console = Join-Path $env:USERPROFILE 'godot\Godot_v4.4.1-stable_win64_console.exe'
          if (-not (Test-Path -LiteralPath $console -PathType Leaf)) {
            # setup-godot's cache can contain only the GUI .exe, omitting the companion console .exe.
            # Recover BOTH official files from the exact upstream Godot 4.4.1 archive.
            $archive = Join-Path $env:RUNNER_TEMP 'Godot_v4.4.1-stable_win64.exe.zip'
            $uri = 'https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_win64.exe.zip'
            Write-Host 'Restoring missing console companion from official Godot 4.4.1 release ZIP'
            Invoke-WebRequest -Uri $uri -OutFile $archive -TimeoutSec 180
            if ((Get-Item -LiteralPath $archive).Length -lt 1000000) { throw 'Official download is too small' }
            Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $env:USERPROFILE 'godot') -Force
          }
          if (-not (Test-Path -LiteralPath $console -PathType Leaf)) { throw "Console companion still missing after archive recovery: $console" }
          $env:GODOT_BIN = $console
          "GODOT_BIN=$console" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Testing console executable: $console"
          & $console --version
          if ($LASTEXITCODE -ne 0) { throw 'Godot 4.4.1 console --version failed' }
          python tools/check_ci_pipeline.py
          if ($LASTEXITCODE -ne 0) { throw 'CI preflight failed' }
          python tools/static_preflight.py
          if ($LASTEXITCODE -ne 0) { throw 'Static preflight failed' }
          python tools/sync_release_notices.py
          if ($LASTEXITCODE -ne 0) { throw 'Credits media registry failed' }
          python tools/check_creator_provenance_v0166.py
          if ($LASTEXITCODE -ne 0) { throw 'Creator provenance failed' }
          python tools/audit_embedded_fbx_textures_v0170.py
          if ($LASTEXITCODE -ne 0) { throw 'Embedded FBX PNG byte-level parent audit failed' }
          # selftest_acceptance_runner.py intentionally invokes the Linux Bash runner via
          # 'bash'; on Windows 'bash' resolves to WSL, which is not installed in hosted CI.
          # That Linux-only mock has already been validated in the Ubuntu workflow.
          # The Windows runner verifies its own 23-suite manifest and actually executes Godot.
          Write-Host 'Skipping Linux Bash mock harness on native Windows runner; Windows 23-suite QA follows.'
      - name: Independently verify real Windows resource import, scene startup and 23 QA scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/windows_native_acceptance_v0170.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Preserve Windows engine validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LCG-P05_WINDOWS_NATIVE_VALIDATION_LOGS
          path: documentation/windows_ci_diagnostics/
          if-no-files-found: warn
          retention-days: 14

      # Strict Windows-specific gate above must have exited 0 before internal export.
      # This still reruns the project's original Windows acceptance script.
      - name: Attempt gated Windows INTERNAL TEST ONLY build (no storefront publishing)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:GODOT_BIN -or -not (Test-Path -LiteralPath $env:GODOT_BIN -PathType Leaf)) { throw 'GODOT_BIN not set to Windows console binary' }
          & ./tools/build_windows_release.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Preserve build and licence snapshot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LCG-P05_WINDOWS_EXPORT_LOGS
          path: |
            documentation/WINDOWS_EXPORT_RESULT.txt
            documentation/WINDOWS_EXPORT_LOG.txt
            documentation/native_run_logs/
            licenses/GODOT_BINARY_DEPENDENCIES.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Verify standalone EXE starts in a source-free Windows folder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./tools/check_standalone_windows_exe_v0170.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Preserve standalone EXE smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LCG-P05_STANDALONE_RUNTIME_SMOKE_LOGS
          path: documentation/windows_standalone_smoke/
          if-no-files-found: warn
          retention-days: 14
      - name: Store INTERNAL TEST ONLY EXE only when both native and release builder checks pass
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LCG-P05_INTERNAL_TEST_ONLY
          path: dist/LCG-P05_INTERNAL_TEST_ONLY.exe
          if-no-files-found: error
          retention-days: 7

# Retest strict Windows QA and gated EXE after Godot config section indexing correction.
# Retest internal EXE and source-free smoke after explicit PowerShell success exit code fix.
